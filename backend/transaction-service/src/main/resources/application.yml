server:
  port: 8084

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:spendwise_expense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://${EUREKA_HOST:localhost}:9000/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Gmail SMTP & Email Notification Configuration
fintrack:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your_corporate_sender@gmail.com}
    password: ${SMTP_PASSWORD:your_16_char_google_app_password}
    from-email: ${SMTP_FROM_EMAIL:your_corporate_sender@gmail.com}
    from-name: ${SMTP_FROM_NAME:FinTrack Notifications}
    enabled: ${SMTP_ENABLED:false}
    auth: ${SMTP_AUTH:true}
    starttls:
      enable: ${SMTP_STARTTLS:true}
      required: ${SMTP_STARTTLS_REQUIRED:true}
    timeout-ms: ${SMTP_TIMEOUT_MS:10000}
    connection-timeout-ms: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
    write-timeout-ms: ${SMTP_WRITE_TIMEOUT_MS:10000}
    app-url: ${APP_FRONTEND_URL:http://localhost:5173}
