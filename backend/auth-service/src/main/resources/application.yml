server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendwise_auth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:9000/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000 # 24 hours

management:
  endpoints:
    web:
      exposure:
        include: health,info

fintrack:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:your_corporate_sender@gmail.com}
    password: ${SMTP_PASSWORD:your_16_char_google_app_password}
    from-email: ${SMTP_FROM_EMAIL:your_corporate_sender@gmail.com}
    from-name: ${SMTP_FROM_NAME:FinTrack Security}
    enabled: ${SMTP_ENABLED:false}
    auth: ${SMTP_AUTH:true}
    starttls:
      enable: ${SMTP_STARTTLS:true}
      required: ${SMTP_STARTTLS_REQUIRED:true}
    timeout-ms: ${SMTP_TIMEOUT_MS:10000}
    connection-timeout-ms: ${SMTP_CONNECTION_TIMEOUT_MS:10000}
    write-timeout-ms: ${SMTP_WRITE_TIMEOUT_MS:10000}
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    reset-token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
