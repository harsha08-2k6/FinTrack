        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: "tsivaharshavardhanreddy08@gmail.com"
      - key: SMTP_PASSWORD
        sync: false
