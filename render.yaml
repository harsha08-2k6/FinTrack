    name: expense-service
    env: docker
    region: oregon
    plan: free
    rootDir: backend/expense-service
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://eureka-server.onrender.com/eureka/
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.iopschksmghvgfctefuq.supabase.co:5432/postgres
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # ==========================================
  # Report Service
  # ==========================================
  - type: web
    name: report-service
    env: docker
    region: oregon
    plan: free
    rootDir: backend/report-service
    healthCheckPath: /actuator/health
    envVars:
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: https://eureka-server.onrender.com/eureka/
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://db.iopschksmghvgfctefuq.supabase.co:5432/postgres
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # ==========================================
