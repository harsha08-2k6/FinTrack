version: '3.8'

services:
  # ==========================================================
  # MySQL Database (Multi-database initialization)
  # ==========================================================
  mysql-db:
    image: mysql:8.0
    container_name: spendwise-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database:/docker-entrypoint-initdb.d
    networks:
      - spendwise-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Eureka Discovery Server (:9000)
  # ==========================================================
  eureka-server:
    build:
      context: ../backend/eureka-server
      dockerfile: Dockerfile
    container_name: spendwise-eureka
    restart: on-failure
    ports:
      - "9000:9000"
    networks:
      - spendwise-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==========================================================
  # Auth Service (:8081)
  # ==========================================================
  auth-service:
    build:
      context: ../backend/auth-service
      dockerfile: Dockerfile
    container_name: spendwise-auth
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/spendwise_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9000/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - spendwise-net

  # ==========================================================
  # Category Service (:8082)
  # ==========================================================
  category-service:
    build:
      context: ../backend/category-service
      dockerfile: Dockerfile
    container_name: spendwise-category
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/spendwise_category?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9000/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - spendwise-net

  # ==========================================================
  # Expense Service (:8083)
  # ==========================================================
  expense-service:
    build:
      context: ../backend/expense-service
      dockerfile: Dockerfile
    container_name: spendwise-expense
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/spendwise_expense?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9000/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - spendwise-net

  # ==========================================================
  # Report Service (:8084)
  # ==========================================================
  report-service:
    build:
      context: ../backend/report-service
      dockerfile: Dockerfile
    container_name: spendwise-report
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/spendwise_report?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9000/eureka/
    depends_on:
      mysql-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    networks:
      - spendwise-net

  # ==========================================================
  # API Gateway (:8080)
  # ==========================================================
  api-gateway:
    build:
      context: ../backend/api-gateway
      dockerfile: Dockerfile
    container_name: spendwise-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:9000/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - spendwise-net

  # ==========================================================
  # React Frontend (:5173)
  # ==========================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: spendwise-frontend
    restart: on-failure
    ports:
      - "5173:5173"
    environment:
      VITE_API_GATEWAY_URL: http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - spendwise-net

networks:
  spendwise-net:
    driver: bridge

volumes:
  mysql_data:
